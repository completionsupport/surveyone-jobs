name: Bootstrap SurveyOne Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified repository files
        run: |
          if [ ! -f surveyone-jobs-bootstrap.zip ]; then
            echo "Repository is already bootstrapped."
            exit 0
          fi
          unzip -o surveyone-jobs-bootstrap.zip -x '.github/*'
          rm surveyone-jobs-bootstrap.zip
      - name: Commit repository contents
        run: |
          if [ ! -f README.md ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Initialize SurveyOne Jobs feed"
            git push
          fi
