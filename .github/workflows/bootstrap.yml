name: Bootstrap SurveyOne Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified repository files
        run: |
          unzip -o surveyone-jobs-bootstrap.zip
          rm surveyone-jobs-bootstrap.zip
          rm .github/workflows/bootstrap.yml
      - name: Commit repository contents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize SurveyOne Jobs feed"
          git push
