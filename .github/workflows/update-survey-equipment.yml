name: Update Survey Equipment
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survey-equipment
  cancel-in-progress: false
jobs:
  equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: equipment/package-lock.json
      - run: pip install -r jobs/requirements.txt
      - run: npm ci --prefix equipment --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s equipment/test -p 'test_*.py' -v
      - run: npm test --prefix equipment
      - name: Read current approved sources and refresh candidates
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node equipment/publish.cjs snapshot --limit 120
      - name: Discover and verify supplier offers
        run: python -m equipment.collector
      - name: Publish validated external equipment without notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node equipment/publish.cjs publish
      - name: Collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-run-diagnostics
          path: equipment/last-run.json
          if-no-files-found: ignore
          retention-days: 14
