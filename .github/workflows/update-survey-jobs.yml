name: Update Survey Jobs
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: survey-jobs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - run: python -m unittest discover -s jobs/tests -v
      - run: python -m jobs.collector.main
      - name: Save feed and collector state when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobs/jobs.json jobs/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Survey Jobs [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
      - name: Check notification configuration
        id: config
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Reserve notification before delivery
        if: steps.config.outputs.enabled == 'true'
        id: reserve
        run: |
          python -m jobs.collector.notify reserve
          git add jobs/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Reserve Survey Jobs notification [skip ci]"
            git push
          fi
      - name: Send one FCM notification
        if: steps.reserve.outputs.send == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m jobs.collector.notify send
